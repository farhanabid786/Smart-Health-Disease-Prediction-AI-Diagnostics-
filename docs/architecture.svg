<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SmartHealth Clinical architecture</title>
  <desc id="desc">A visual map of the React frontend, FastAPI backend, Gemini services, local fallbacks, and report exports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A20"/>
      <stop offset="1" stop-color="#123C3D"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65E6C2"/>
      <stop offset="1" stop-color="#2CA88D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CD7FF"/>
      <stop offset="1" stop-color="#4D8BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8AB6B2"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="-20" r="180" fill="#65E6C2" opacity=".08"/>
  <circle cx="160" cy="380" r="220" fill="#4D8BFF" opacity=".08"/>

  <text x="56" y="54" fill="#F5FFFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">SmartHealth Clinical</text>
  <text x="56" y="80" fill="#9FC8C2" font-family="Segoe UI, Arial, sans-serif" font-size="14">A calm path from health context to explainable triage support</text>

  <g filter="url(#shadow)">
    <rect x="56" y="128" width="220" height="150" rx="18" fill="#F5FFFC"/>
    <rect x="310" y="128" width="220" height="150" rx="18" fill="#DDF9F0"/>
    <rect x="564" y="128" width="220" height="150" rx="18" fill="#EAF3FF"/>
    <rect x="818" y="128" width="326" height="150" rx="18" fill="#FFF4D9"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="94" cy="168" r="18" fill="url(#mint)"/>
    <text x="94" y="174" text-anchor="middle" fill="#073A35" font-size="16" font-weight="700">1</text>
    <text x="124" y="171" fill="#123C3D" font-size="17" font-weight="700">Browser workspace</text>
    <text x="78" y="204" fill="#426460" font-size="13">React + TypeScript</text>
    <text x="78" y="225" fill="#426460" font-size="13">Health card · charts</text>
    <text x="78" y="246" fill="#426460" font-size="13">Chat · PDF export</text>

    <circle cx="348" cy="168" r="18" fill="url(#mint)"/>
    <text x="348" y="174" text-anchor="middle" fill="#073A35" font-size="16" font-weight="700">2</text>
    <text x="378" y="171" fill="#123C3D" font-size="17" font-weight="700">FastAPI gateway</text>
    <text x="332" y="204" fill="#426460" font-size="13">Validation with Pydantic</text>
    <text x="332" y="225" fill="#426460" font-size="13">Auth · prediction · chat</text>
    <text x="332" y="246" fill="#426460" font-size="13">OpenAPI at /docs</text>

    <circle cx="602" cy="168" r="18" fill="url(#blue)"/>
    <text x="602" y="174" text-anchor="middle" fill="#082B55" font-size="16" font-weight="700">3</text>
    <text x="632" y="171" fill="#123C3D" font-size="17" font-weight="700">Gemini services</text>
    <text x="586" y="204" fill="#42607A" font-size="13">Structured assessment</text>
    <text x="586" y="225" fill="#42607A" font-size="13">Contextual health chat</text>
    <text x="586" y="246" fill="#42607A" font-size="13">JSON-shaped output</text>

    <circle cx="856" cy="168" r="18" fill="#F2C15B"/>
    <text x="856" y="174" text-anchor="middle" fill="#5B3D05" font-size="16" font-weight="700">4</text>
    <text x="886" y="171" fill="#123C3D" font-size="17" font-weight="700">Resilient fallback</text>
    <text x="840" y="204" fill="#6E5A2C" font-size="13">Rule-based local triage</text>
    <text x="840" y="225" fill="#6E5A2C" font-size="13">Demo chat responses</text>
    <text x="840" y="246" fill="#6E5A2C" font-size="13">No silent hard failure</text>
  </g>

  <path d="M276 203 H300" stroke="#8AB6B2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M530 203 H554" stroke="#8AB6B2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M784 203 H808" stroke="#8AB6B2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="326" text-anchor="middle" fill="#9FC8C2" font-family="Segoe UI, Arial, sans-serif" font-size="12">Live AI when configured · transparent local mode when unavailable</text>
</svg>
